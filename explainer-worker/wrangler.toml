name = "earthquake-explainer"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# ANTHROPIC_API_KEY is a secret: `npx wrangler secret put ANTHROPIC_API_KEY`.
# Never put it in this file; this repo is public.

[vars]
ALLOWED_ORIGINS = "https://georgiafbi.github.io,http://localhost:3000"

# New explanations (cache misses) per visitor IP. Cached ones are free and unlimited.
[[ratelimits]]
name = "EXPLAIN_LIMITER"
namespace_id = "4101"

  [ratelimits.simple]
  limit = 6
  period = 60

[observability]
enabled = true
